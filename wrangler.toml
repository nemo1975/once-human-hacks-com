# Static Astro site — custom worker for preview-host noindex; assets served from dist/.
# Production domain: https://oncehumanhacks.com
name = "oncehumanhacks-com"
main = "worker.mjs"
compatibility_date = "2025-10-11"

[build]
command = "npm ci && npm run build"
cwd = "."

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Custom domains for oncehumanhacks.com must be added in the dashboard (zone must be on this account).
workers_dev = true
